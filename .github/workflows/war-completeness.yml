# Checks that the WAR actually contains the classes it references, so a missing
# runtime dependency fails here instead of throwing NoClassDefFoundError in
# production. See tools/check-war-completeness.py for the full rationale.
#
# This complements the dependency-drift check rather than overlapping it. Drift
# compares versions of TOP-LEVEL pom dependencies; it is blind to a transitive
# nobody declared. That gap is what let the WAR ship okhttp -- a Kotlin library --
# with no kotlin-stdlib anywhere in it, which broke the Square payment path.
#
# ENFORCING: --strict makes an unexpected class fail the job. Until 2026-07-23 this
# ran report-only, which was a trap -- `completeness` was already a required status
# check, so the gate looked enforcing on the branch rules while the script could only
# ever exit 0. The only thing it actually proved was that `ant package` succeeded,
# which the `build` check already proves.
#
# The precondition the earlier comment set -- PR #207 merged and the report clean --
# was met on 2026-07-21. Verified before enabling: a locally built WAR reports
# "0 unexpected, 46 allowlisted" and exits 0 under --strict, and the same WAR with
# kotlin-stdlib deleted exits 1 with 73 unexpected classes (okhttp needs kotlin.*),
# reproducing the original Square failure. The gate discriminates.
name: WAR completeness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 21

      # The check inspects the assembled artifact, so it has to be built first.
      - name: Build the WAR
        run: ant -noinput -buildfile build.xml -lib lib/war package

      - name: Fail if a class is referenced but missing from the WAR
        run: python3 tools/check-war-completeness.py --war target/simis-cms.war --strict

      # Same idea one layer out: the WAR should carry the source maps a served file declares,
      # and only those. 53 maps belonging to vendor originals no page loads were shipping as
      # 4.93 MB nobody could ever fetch (issues 1860, 1862), and the fix leaves build.xml with a
      # hand-kept list of the survivors. This checks that list against the artifact in both
      # directions, so it cannot rot back.
      - name: Fail if the WAR's source maps and their declarations disagree
        run: python3 tools/check-source-maps.py --war target/simis-cms.war --root .

      # And one layer out again: the maps check answers "is this .map reachable?", not "is the
      # asset itself reachable, and is every asset a page links actually here?". Nothing checked
      # either -- check-war-completeness.py above covers Java classes only -- which is how 17.8 MB
      # of vendor builds no page loads came to ship, and how two <link> tags pointing at files
      # that do not exist went unnoticed (issue 1862).
      - name: Fail if the WAR ships an unreachable vendor build or drops a referenced asset
        run: python3 tools/check-vendor-builds.py --war target/simis-cms.war --root .
