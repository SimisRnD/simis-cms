name: CI Gates
on: [pull_request]

jobs:
  migration-validation:
    name: Validate Migration Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate migration versions (REQUIRED)
        run: |
          if ! ./scripts/validate-migration-versions.sh; then
            echo "❌ Migration version conflicts detected"
            echo "Fix duplicate versions before merging"
            exit 1
          fi

  version-consistency:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Extract versions
        id: versions
        run: |
          APP_VERSION=$(grep 'VERSION = ' src/main/java/com/simisinc/platform/ApplicationInfo.java | sed 's/.*"\([^"]*\)".*/\1/')
          POM_VERSION=$(grep '<version>' pom.xml | head -1 | sed 's/.*<version>\([^<]*\)<.*/\1/' | sed 's/-SNAPSHOT//')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "pom_version=$POM_VERSION" >> $GITHUB_OUTPUT

      - name: Verify version consistency (REQUIRED)
        run: |
          APP_VERSION="${{ steps.versions.outputs.app_version }}"
          POM_VERSION="${{ steps.versions.outputs.pom_version }}"

          if [[ "$APP_VERSION" != "$POM_VERSION" ]]; then
            echo "❌ FATAL: Version mismatch"
            echo "   ApplicationInfo.VERSION = $APP_VERSION"
            echo "   pom.xml version = $POM_VERSION-SNAPSHOT"
            echo ""
            echo "Fix: Update pom.xml to match ApplicationInfo.VERSION"
            exit 1
          fi

          echo "✅ Versions consistent: $APP_VERSION"

  testing-markers:
    name: Check for Testing Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Search for [TESTING] markers in Java code
        run: |
          if git diff origin/main HEAD -- '*.java' | grep '\[TESTING\]'; then
            echo "❌ FATAL: Cannot merge - [TESTING] markers found"
            echo ""
            echo "These markers indicate temporary testing code that must be removed:"
            git diff origin/main HEAD -- '*.java' | grep -B2 -A2 '\[TESTING\]'
            exit 1
          fi
          echo "✅ No testing markers found"
