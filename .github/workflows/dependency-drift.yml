# Enforces parity between pom.xml and the vendored lib/build jars that actually ship
# in the WAR. See tools/check-dependency-drift.py for the full rationale.
#
# ENFORCING (--strict): fails the build on any pom-vs-vendored version drift that is
# not in the script's ALLOWLIST. The one-time reconciliation zeroed the drift down to
# two documented, intentional holds (flexmark fat-jar, jackson-coreutils), which are
# allowlisted with revisit triggers; everything else must match. New drift fails here.
#
# Also enforces that the pom's own project <version> tracks ApplicationInfo.VERSION,
# the constant build.xml stamps the build with. Nothing in the build reads the pom's
# version, so it goes stale unnoticed -- it had fallen two and a half years behind by
# v20260719.10000. See tools/check-version-consistency.py.
#
# Also verifies every vendored jar byte-for-byte against lib/PROVENANCE.sha256 --
# the version checks above compare names, not bytes, so a tampered or swapped jar
# would pass them and ship in the WAR. See tools/check-vendored-provenance.py.
#
# The four CSS steps ride along here rather than in their own workflow: they are
# the same shape of check (a pure-python guard over a committed file, no build
# needed) and sharing one checkout keeps them a single job. The contrast gate is
# the only one of the four that looks at a colour *value* -- the others count
# literals, byte-diff a generated file, and compare a fallback against the token
# it stands in for, which is why #1489 shipped past all of them.
name: Dependency drift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships python3; no extra setup or network needed.
      - name: Fail on un-allowlisted pom vs vendored-jar drift
        run: python3 tools/check-dependency-drift.py . --strict
      - name: Fail on pom vs ApplicationInfo project-version drift
        run: python3 tools/check-version-consistency.py . --strict
      - name: Fail on vendored-jar bytes not matching lib/PROVENANCE.sha256
        run: python3 tools/check-vendored-provenance.py .
      # The served Foundation stylesheet is generated from the vendored original, so a
      # re-vendored Foundation that nobody regenerated -- or a hand-edited generated file --
      # would silently ship a stylesheet that no longer matches its source.
      - name: Fail on a stale generated Foundation stylesheet
        run: python3 tools/route-foundation-tokens.py . --check
      # Hardcoded colours in first-party CSS may fall, never rise -- otherwise every
      # new rule is a chance to add another literal and the routing work only keeps level.
      - name: Fail on new hardcoded colours in first-party CSS
        run: python3 tools/check-css-token-adoption.py .
      # Evaluates the token values themselves: declared pairings against their WCAG
      # floors, dark-vs-auto parity, and every contrast ratio quoted in a comment
      # re-derived from the declaration it describes. See issue #1489 -- the value
      # drifted, the comment did not, and nothing in CI could tell.
      - name: Fail on design tokens below their WCAG contrast floor
        run: python3 tools/check-token-contrast.py .
      # A var() fallback is what renders when the token stylesheet does not load, and
      # image-browser.jsp deliberately loads platform.css on its own -- no Foundation,
      # no platform-tokens.css -- so on that page every fallback in it is the live
      # value, not a safety net. Nothing re-pointed them when a token moved, and the
      # tool that catches it was written and then never wired up. See issue #1565.
      - name: Fail on var() fallbacks that no longer match their token
        run: python3 tools/check-css-var-fallbacks.py .
