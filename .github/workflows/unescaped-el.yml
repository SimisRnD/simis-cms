# Fast, build-free static gates that only need python3.
#
# 1. Unescaped EL: fails when a JSP renders an EL expression into HTML or JavaScript without
#    escaping and without a recorded justification. See tools/check-unescaped-el.py. ENFORCING
#    (--strict): the sweep that produced this fixed 29 injection points and classified the rest;
#    every remaining unescaped site carries an ALLOWLIST entry saying why the value cannot carry
#    markup. A NEW one cannot appear without somebody writing that justification down.
#
# 2. XML well-formedness: parses the XML config files that only Tomcat reads at startup
#    (server.xml, context.xml, web.xml, the TLDs), so a malformed one fails here in ~1s rather
#    than at container boot as an opaque "Cannot start server". See tools/check-xml-well-formed.py.
#    This has bitten twice (PR #178, PR #221) -- both caught expensively by the deploy smoke test,
#    which stays as the thorough last gate; this is the cheap first one.
#
# 3. Duplicate widget-preference tags: fails when a <widget> block in a *-layout.xml file
#    defines the same preference tag twice. addWidgetPreferences() has no duplicate-key
#    detection, so the second occurrence silently overwrites the first with no error anywhere.
#    See tools/check-widget-duplicate-tags.py. This happened for real (issue #562 / PR #578):
#    two dashboard tiles were live in the XML but never rendered until a manual browser check
#    caught it (fixed narrowly in PR #650). A scan of all 468 existing <widget> blocks found no
#    legitimate use of a repeated direct-child tag, so there is no known false positive to avoid.
#
# 4. Duplicate Flyway migration versions: fails when two migrations share a version within one
#    Flyway location set. Flyway does not choose between them -- it throws, which aborts
#    DatabaseMigrationTest and ItemOrderMigrationTest in @BeforeAll. junitlauncher records that
#    as a container-level failure, so every per-class "Tests run" line still reads Failures: 0
#    while ~20 tests never execute and the Ant build dies on hasFailingTest with no visible
#    failing test. See tools/check-duplicate-migration-versions.py. This has happened twice:
#    PR #585 (20260728.1000), and on 2026-08-06 three settings branches all chose 20260806.1000.
#    Nothing catches it on a branch in isolation -- the collision only exists once both sides are
#    in one tree -- so it lands on whichever PR merges second, which is exactly when it is most
#    confusing. This check runs in about a second and names both offenders.
name: Static checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Job id kept as `unescaped-el` on purpose: it is a required status check in the
  # Protect Main ruleset, and the required context is the job name. Adding the XML
  # check as a step here means it is enforced immediately through that existing
  # required context, with no ruleset change needed.
  unescaped-el:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships python3; no extra setup or network needed.
      - name: Fail on malformed XML config (server.xml, context.xml, web.xml, TLDs)
        run: python3 tools/check-xml-well-formed.py . --strict
      - name: Fail on unescaped JSP EL without a recorded justification
        run: python3 tools/check-unescaped-el.py . --strict
      - name: Fail on a widget block that defines the same preference tag twice
        run: python3 tools/check-widget-duplicate-tags.py . --strict
      - name: Fail on two Flyway migrations sharing a version
        run: python3 tools/check-duplicate-migration-versions.py . --strict
