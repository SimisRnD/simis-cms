# Fast, build-free static gates that only need python3.
#
# 1. Unescaped EL: fails when a JSP renders an EL expression into HTML or JavaScript without
#    escaping and without a recorded justification. See tools/check-unescaped-el.py. ENFORCING
#    (--strict): the sweep that produced this fixed 29 injection points and classified the rest;
#    every remaining unescaped site carries an ALLOWLIST entry saying why the value cannot carry
#    markup. A NEW one cannot appear without somebody writing that justification down.
#
# 2. XML well-formedness: parses the XML config files that only Tomcat reads at startup
#    (server.xml, context.xml, web.xml, the TLDs), so a malformed one fails here in ~1s rather
#    than at container boot as an opaque "Cannot start server". See tools/check-xml-well-formed.py.
#    This has bitten twice (PR #178, PR #221) -- both caught expensively by the deploy smoke test,
#    which stays as the thorough last gate; this is the cheap first one.
#
# 3. Duplicate widget-preference tags: fails when a <widget> block in a *-layout.xml file
#    defines the same preference tag twice. addWidgetPreferences() has no duplicate-key
#    detection, so the second occurrence silently overwrites the first with no error anywhere.
#    See tools/check-widget-duplicate-tags.py. This happened for real (issue #562 / PR #578):
#    two dashboard tiles were live in the XML but never rendered until a manual browser check
#    caught it (fixed narrowly in PR #650). A scan of all 468 existing <widget> blocks found no
#    legitimate use of a repeated direct-child tag, so there is no known false positive to avoid.
#
# 4. Duplicate Flyway migration versions: fails when two migrations share a version within one
#    Flyway location set. Flyway does not choose between them -- it throws, which aborts
#    DatabaseMigrationTest and ItemOrderMigrationTest in @BeforeAll. junitlauncher records that
#    as a container-level failure, so every per-class "Tests run" line still reads Failures: 0
#    while ~20 tests never execute and the Ant build dies on hasFailingTest with no visible
#    failing test. See tools/check-duplicate-migration-versions.py. This has happened twice:
#    PR #585 (20260728.1000), and on 2026-08-06 three settings branches all chose 20260806.1000.
#    Nothing catches it on a branch in isolation -- the collision only exists once both sides are
#    in one tree -- so it lands on whichever PR merges second, which is exactly when it is most
#    confusing. This check runs in about a second and names both offenders.
#
# 5. Inline event handlers dead under the CSP: fails when a served JSP carries an inline on*=
#    attribute (onclick, onchange, onsubmit, ...). PageServlet sends Content-Security-Policy:
#    script-src 'self' 'nonce-<random>' with no 'unsafe-inline' and no 'unsafe-hashes', so the
#    browser refuses to run inline handlers -- they fall under script-src-attr, which a nonce
#    does not cover -- and the control silently does nothing (a logo upload, issue #1190; the
#    Media Library sort dropdown, #1194; admin Delete/Enable/Disable links). See
#    tools/check-inline-handlers.py and issue #1188. ENFORCING (--strict) against a baseline
#    ALLOWLIST of the handlers still to be converted to addEventListener; that number only
#    shrinks, and a NEW inline handler -- or a count bumped above the recorded baseline -- fails
#    here. JSP/HTML comments and <script> bodies are blanked out first (preserving line numbers),
#    so prose that merely mentions onclick= or a JS "el.onclick = fn" assignment is not a finding.
name: Static checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Job id kept as `unescaped-el` on purpose: it is a required status check in the
  # Protect Main ruleset, and the required context is the job name. Adding the XML
  # check as a step here means it is enforced immediately through that existing
  # required context, with no ruleset change needed.
  unescaped-el:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships python3; no extra setup or network needed.
      - name: Fail on malformed XML config (server.xml, context.xml, web.xml, TLDs)
        run: python3 tools/check-xml-well-formed.py . --strict
      - name: Fail on unescaped JSP EL without a recorded justification
        run: python3 tools/check-unescaped-el.py . --strict
      - name: Fail on a widget block that defines the same preference tag twice
        run: python3 tools/check-widget-duplicate-tags.py . --strict
      - name: Fail on two Flyway migrations sharing a version
        run: python3 tools/check-duplicate-migration-versions.py . --strict
      - name: Fail on inline on*= event handlers that the CSP makes dead
        run: python3 tools/check-inline-handlers.py . --strict
      - name: Fail on a theme colour rule that reaches the admin console
        run: python3 tools/check-theme-scope.py . --strict
      - name: Fail on a themed button colour that reaches a hollow or clear button
        run: python3 tools/check-button-variant-scope.py . --strict
      # The adoption ratchet counts hex literals, which a runtime theme rule does not have -- it
      # points at a custom property. That is how 22 theme rules reached the admin console with the
      # adoption number unmoved across three PRs (issue 1598). This compares the two layers
      # directly instead of counting literals.
      - name: Fail on a new overlap between the runtime theme and the token layer
        run: python3 tools/check-theme-token-overlap.py . --strict
      # main.jsp emits a screen-reader h1 on admin-console pages, so an authored h4 there is an
      # h1 -> h4 jump and an authored h1 is a second h1 on the page. Both happened and neither
      # was detected: issue 1622 catalogued the skips by hand and had the count wrong twice over,
      # and the duplicate h1s (issue 1660) were never catalogued at all.
      - name: Fail on a skipped heading level or a duplicate h1 in the admin console
        run: python3 tools/check-heading-levels.py . --strict
      # Who sees an admin menu row (main.jsp) and who may open the page it links to
      # (the layout XML) are decided in two files, usually in two different PRs, with
      # nothing connecting them. A row wider than its page is a link the user is denied
      # on click, and no error is raised anywhere. Issue #1764 moves the CSP Violations
      # row into the Access section, whose gate admits admin:manage while
      # /admin/csp-violations is role="admin" only -- PR #1768 spotted that by hand and
      # wrapped the row in its own hasRole('admin') test. This makes that requirement
      # enforced rather than remembered. ENFORCING (--strict) against an ALLOWLIST of
      # the three pre-existing rows, which only shrinks.
      - name: Fail on an admin menu row that links to a page its viewer cannot open
        run: python3 tools/check-admin-nav-permissions.py . --strict
      # A Save*Command's length limit is a second copy of a number whose truth is in the DDL. A
      # migration that widens a column leaves a stale constant; one that narrows a column leaves a
      # check that passes values the database then rejects, putting issue #1740 straight back in
      # the place it was fixed. Nothing else in the build compares the two.
      - name: Fail on a field-length limit that no longer matches its column width
        run: python3 tools/check-column-length-limits.py . --strict
      - name: Fail on a wildcard CORS origin or an unallowlisted printStackTrace
        run: python3 tools/check-server-hygiene.py . --strict
