# Tests for the tools/*.py check scripts -- the scripts the other gates run.
# A gate whose own logic is untested can rot silently (the completeness gate
# was a placebo for weeks before PR #243); this suite pins each tool's CLI
# contract: discovery rules, findings, and exit codes, strict and non-strict.
#
# Coverage note (deliberate): check-war-completeness.py needs a built WAR and is
# exercised for real by war-completeness.yml on every PR, so a synthetic test here
# would be a weaker version of what already runs.
#
# generate-db-vex.py was listed here for the same reason -- its input is the GitHub
# API. That reasoning covered the wrong half. The API-dependent part is not where the
# danger is: the tool's input can legitimately come back empty, an empty input yields a
# structurally valid document asserting nothing, and it used to be redirected over the
# real file, so the shell truncated it before the script ran. On 2026-08-26 that would
# have replaced 54 suppressions with none and exited 0 (issue #1463). Its guards are
# pure functions over a path and are covered here now; the alert-fetching half still
# is not. The five filesystem-pure tools are covered here, plus
# detect_unsafe_migrations.py (issue #399), which drives real git commits in a
# synthetic tmp_path repo since its Java-removal detection reads `git diff`.
name: Tools tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Run the tools test suite
        run: python3 -m pytest tools/tests -q
