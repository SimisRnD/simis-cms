# Scans every pull request for secrets before merge. This is a PR-time complement to
# the TruffleHog scan already in publish-images.yml -- that one only runs on push to
# main, a release, or the monthly schedule, so it catches a leaked secret only after
# a PR has already merged. This one runs while the PR is still open, so a finding
# shows up as a failing check on the PR itself instead of after the fact.
#
# This job's check-run name (secret-scan) is already in the "Protect Main" ruleset's
# required status checks, so a finding here blocks merge, not just reports on the PR.
name: Secret Scan (Pull Request)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # --exclude-globs suppresses two confirmed false positives:
      #   - lib/PROVENANCE.sha256: the vendored-jar checksum manifest dependency-drift.yml
      #     checks. Every line is a SHA-256 hash by design, which reads as a plausible
      #     secret to any entropy/pattern-based scanner. This file changes on nearly every
      #     dependency bump, so without the exclusion a routine PR touching it would fail
      #     this check.
      #   - lib/**: everything else under lib/ (build, compile, style, tests, war) is a
      #     vendored third-party dependency jar, never SimIS-authored source -- there is
      #     nothing here for a secret to leak from. Confirmed the specific trigger: the
      #     TravisCI detector misreads the literal Maven POM tag name "distributionManagement"
      #     (present in some vendored jars' embedded pom.xml) as a plausible token. Scoped to
      #     the whole tree rather than the specific jars hit so far, since any future
      #     dependency bump could introduce the same false positive in a different jar.
      #
      # This list is deliberately SHORTER than publish-images.yml's, which carries two entries this
      # one does not. The lists are not meant to match: that workflow scans from the last release tag
      # across history, which cannot be edited, while this one scans only the diff a pull request
      # introduces. An entry earns its place here only if a live, incoming diff can trip it.
      #
      #   - src/test/java/.../infrastructure/database/DatabasePropertiesTest.java is excluded THERE
      #     because commit bbffcee4 (2026-08-10) already contains a stand-in connection string and no
      #     edit today changes what that commit held (issue #2066, PR #2067). It is NOT excluded here,
      #     because the live file no longer spells one out -- the expected URL is assembled from the
      #     same constants the test feeds in -- so an incoming diff has nothing for the detector to
      #     match. Excluding it here instead would blind this gate on the one file in the tree whose
      #     entire subject matter is database and Azure SPN credentials. Measured, not assumed: with
      #     that path excluded, a connection string carrying a real host and password pasted into the
      #     file is reported zero times; without it, both the Postgres and JDBC detectors report it.
      #   - tools/tests/test_check_xml_well_formed.py is excluded THERE for a Lob-detector false
      #     positive on a pytest function name. It does not reproduce on the version pinned below --
      #     that file scans clean, including with every one of its lines re-added -- so adding it here
      #     would be an exclusion carrying no finding, costing coverage for nothing.
      #
      # IF THIS CHECK EVER FIRES ON A TEST FIXTURE: build the string from parts, the way
      # DatabasePropertiesTest now does, rather than adding the path here. That keeps the file scanned.
      - name: Scan the PR diff for secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Pins the SCANNER, which the action SHA above does not. The action shells out to
          # `docker run ghcr.io/trufflesecurity/trufflehog:${version}` and this input defaults to
          # "latest", so without it the gate tracks whatever was published most recently and can
          # change verdict with no repository change -- which is what broke the monthly publish on
          # 2026-10-01. Dependabot updates the `uses:` ref above and cannot update a `with:` input,
          # so the two must be moved together by hand; tools/check-trufflehog-pin.py fails the build
          # if they drift. Keep this equal to the version in the SHA comment above, with no "v".
          version: "3.97.9"
          # The action's own entrypoint already passes --fail unconditionally (exits non-zero
          # on any findings, which is what makes this check actually fail rather than just
          # report) -- passing it again here errors with "flag 'fail' cannot be repeated".
          extra_args: --json --exclude-globs=lib/PROVENANCE.sha256,lib/**
