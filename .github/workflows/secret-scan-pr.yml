# Scans every pull request for secrets before merge. This is a PR-time complement to
# the TruffleHog scan already in publish-images.yml -- that one only runs on push to
# main, a release, or the monthly schedule, so it catches a leaked secret only after
# a PR has already merged. This one runs while the PR is still open, so a finding
# shows up as a failing check on the PR itself instead of after the fact.
#
# Note: this only reports on the PR. To make it a required, merge-blocking check (not
# just a visible one), the job's check-run name must be added to the "Protect Main"
# ruleset's required status checks -- that needs repo admin access.
name: Secret Scan (Pull Request)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan the PR diff for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Exit non-zero on any findings so this check actually fails, not just reports
          extra_args: --fail --json
