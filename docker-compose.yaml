services:

  db:
    build:
      context: ./
      dockerfile: ./docker/db/Dockerfile
    environment:
      POSTGRES_USER: "${DB_USER:?err}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?err}"
    restart: always
    # [STIG] Runtime hardening: block privilege escalation. PostgreSQL Alpine image
    # requires capabilities to set up directories on first run, so we enforce only
    # no-new-privileges instead of dropping ALL. The hardened image (non-root, dedicated
    # postgres user) provides the primary defense; this adds the escalation block.
    security_opt:
      - "no-new-privileges:true"
    networks:
      - platform
    volumes:
      - db-data:/var/lib/postgresql/data:delegated

  app:
    build:
      context: ./
      dockerfile: ./docker/app/Dockerfile
    ports:
      - 80:8080
    # [STIG] Read-only root filesystem. The image pre-extracts the WAR (unpackWARs=false) and
    # routes the App Insights self-diagnostics to the console, so the only writable surfaces at
    # runtime are these tmpfs mounts -- Tomcat's scratch/log dirs -- and the /opt/simis volume
    # (CMS_PATH). Everything else (server.xml, the app, the JRE) is immutable. App Service for
    # Containers exposes no equivalent, so the control is evidenced as a verified image property
    # (see the container-runtime hardening card). The tmpfs dirs are recreated empty each start;
    # nothing here is meant to persist -- access logs are shipped, not retained locally.
    read_only: true
    tmpfs:
      - /usr/local/tomcat/work
      - /usr/local/tomcat/temp
      - /usr/local/tomcat/logs
    # conf/Catalina/localhost is NOT a tmpfs: the image pre-creates it (owned by the runtime
    # user), and Tomcat's HostConfig only needs it to EXIST -- it does not write into it for a
    # directory-deployed app with autoDeploy=false. A tmpfs there would shadow the pre-created
    # dir with an empty root-owned mount and re-introduce the "Unable to create directory" SEVERE.
    environment:
      CMS_ADMIN_USERNAME: "${CMS_ADMIN_USERNAME:?err}"
      CMS_ADMIN_PASSWORD: "${CMS_ADMIN_PASSWORD:?err}"
      CMS_FORCE_SSL: "${CMS_FORCE_SSL:-true}"
      CMS_NODE_TYPE: "${CMS_NODE_TYPE:-standalone}"
      DB_SERVER_NAME: "${DB_SERVER_NAME:-db}"
      DB_SSL: "${DB_SSL:-false}"
      DB_USER: "${DB_USER:?err}"
      DB_PASSWORD: "${DB_PASSWORD:?err}"
      DB_NAME: "${DB_NAME:-simis-cms}"
      # Optional; blank means "use the value shipped in database.properties". The pool is
      # shared with JobRunr, so a deployment on a larger plan or database may want to raise
      # it without rebuilding the WAR (issue #2029).
      DB_MAX_POOL_SIZE: "${DB_MAX_POOL_SIZE:-}"
    restart: on-failure
    # [STIG] Runtime hardening: drop all Linux capabilities and block privilege escalation.
    # Tomcat binds the unprivileged port 8080 and, since the non-root image (PR #219), never
    # setuids -- so it needs no capabilities. no-new-privileges additionally blocks escalation
    # through any setuid binary. Enforced by the container runtime here and in CI's deploy smoke
    # test. App Service for Containers exposes no equivalent, so the control is evidenced as a
    # verified image property rather than platform-enforced config -- see the container-runtime
    # hardening card. Read-only root filesystem is the paired change, landing separately.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - db
    networks:
      - platform
    volumes:
      - web-data:/opt/simis:delegated
      # The one writable+executable surface under the read-only root: Argon2's JNA native library
      # must be extracted and mmap-executed, which the noexec tmpfs above cannot host. A volume is
      # exec (unlike tmpfs); setenv.sh points -Djna.tmpdir here. See docker/app/Dockerfile.
      - jna-exec:/opt/jna

  # Malware scanner for files visitors attach to forms (issue #2130). clamd listens on 3310 on the
  # platform network only; nothing is published to the host. The app reaches it once an admin sets
  # security.clamav.host to "clamav" on /admin/security-properties -- with the host blank, every
  # form upload is rejected rather than stored unscanned. On first start the image downloads the
  # signature database into the clamav-db volume, which takes a minute or two before clamd answers;
  # uploads made before then are rejected, not let through. Pinned by digest like the database
  # image's base: 1.4 is ClamAV's long-term-support line, and the Debian variant is the one built for
  # arm64 as well as amd64.
  clamav:
    image: clamav/clamav:1.4.7-debian@sha256:cac3829563613e6eb21962bc2e6ef999492d4c20c01f17d0b5bec2f4b7ce0320
    restart: always
    # [STIG] Blocks privilege escalation, as for the db service. Capabilities are not dropped: the
    # image sets no USER and starts as root through its /init entrypoint, and running it with every
    # capability dropped has not been tested.
    security_opt:
      - "no-new-privileges:true"
    networks:
      - platform
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  db-data:
  web-data:
  jna-exec:
  clamav-db:

networks:
  platform:
