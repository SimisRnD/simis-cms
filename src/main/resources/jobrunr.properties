# useInMemoryStore must stay false for any deployment that could ever run more than one instance
# (Azure App Service autoscale included): in-memory means each instance has its own unshared job
# queue, so recurring jobs (order processing, newsletter sending, all the retention/cleanup jobs)
# would run independently -- and redundantly -- on every instance instead of being coordinated to
# run once, and all job history is lost on every restart/redeploy. DB-backed storage (Postgres,
# same database as the app) is what SchedulerManager's own "run once across many replicas" design
# actually depends on -- see the admin Job Queue Dashboard's "For Azure" guidance for detail.
org.jobrunr.configuration.useInMemoryStore = false
org.jobrunr.configuration.useBackgroundJobServer = true
# JobRunr's own dashboard (a separate, more detailed UI from the admin Job Queue Dashboard) has no
# built-in login in the open-source edition this app uses -- left off so there's no unauthenticated
# window into job details if this port is ever exposed. The admin Job Queue Dashboard is the
# intended way to monitor jobs in this deployment.
org.jobrunr.configuration.useDashboard = false
org.jobrunr.configuration.dashboardPort = 8000
org.jobrunr.configuration.workerCount = 3
org.jobrunr.configuration.pollIntervalInSeconds = 10
org.jobrunr.configuration.deleteSucceededJobsInHours = 1
org.jobrunr.configuration.deleteDeletedJobsInHours = 1
