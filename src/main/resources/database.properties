dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
# Shared by the web tier AND JobRunr -- SchedulerManager builds its storage provider over this same
# DataSource, so its workers and poller draw from this pool alongside every Tomcat request thread.
# 10 was HikariCP's out-of-the-box default and was never a decision about this application; at that
# size a crawler sweep exhausted it on 2026-09-12 and every request queued behind it for ~90s.
# Override per deployment with DB_MAX_POOL_SIZE.
maximumPoolSize=25
dataSource.user=postgres
dataSource.password=
dataSource.databaseName=simis-cms
dataSource.portNumber=5432
dataSource.serverName=localhost
