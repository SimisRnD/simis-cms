# Site Workflows
---

- id: user-signed-up
  vars:
    user: '{{ event.user }}'
  workflow:
    - email:
      to-user: '{{ user.id }}'
      subject: '{{ site.name }} - Please confirm your email address'
      template: 'cms/site-sign-up'

- id: user-invited
  vars:
    user: '{{ event.user }}'
    invitedBy: '{{ event.invitedBy }}'
  workflow:
    - email:
      to-user: '{{ user.id }}'
      subject: '{{ site.name }} - Welcome to the site'
      template: 'cms/site-invitation'
    - history:
      message: '_{{ invitedBy.fullName }}_ **{{ verb }}** _{{ user.fullName }}_ to the site'
      actor-id: '{{ invitedBy.id }}'
      verb: invited
      object: user
      object-id: '{{ user.id }}'

- id: user-registered
  vars:
    user: '{{ event.user }}'
    ipAddress: '{{ event.ipAddress }}'
    location: '{{ event.location }}'
  workflow:
    - email:
      to-user: '{{ user.id }}'
      subject: 'Thank you for registering'
      template: 'cms/registration-confirmation'
    - email:
      to-role: 'community-manager'
      subject: 'User id {{ user.id }} registered'
      template: 'cms/admin-user-registered-notification'
    - history:
      message: '_{{ user.fullName }}_ **{{ verb }}** with the site'
      actor-id: '{{ user.id }}'
      verb: registered
      object: user
      object-id: '{{ user.id }}'

- id: user-password-reset
  vars:
    user: '{{ event.user }}'
  workflow:
    - email:
      to-user: '{{ user.id }}'
      subject: '{{ site.name }} - Password reset request'
      template: 'cms/site-user-password-reset'

- id: unsuspend-requested
  vars:
    target: '{{ event.target }}'
    requestedBy: '{{ event.requestedBy }}'
    reason: '{{ event.reason }}'
  workflow:
    - email:
      to-role: 'community-manager'
      subject: '{{ site.name }} - An unsuspend request needs your review'
      template: 'cms/admin-unsuspend-requested'
    - email:
      to-role: 'admin'
      subject: '{{ site.name }} - An unsuspend request needs your review'
      template: 'cms/admin-unsuspend-requested'
    - history:
      message: '_{{ requestedBy.fullName }}_ **requested** unsuspending _{{ target.fullName }}_'
      actor-id: '{{ requestedBy.id }}'
      verb: requested
      object: user
      object-id: '{{ target.id }}'

- id: user-account-restored
  vars:
    user: '{{ event.user }}'
    approvedBy: '{{ event.approvedBy }}'
  workflow:
    - email:
      to-user: '{{ user.id }}'
      subject: '{{ site.name }} - Your account has been restored'
      template: 'cms/site-account-restored'
    - history:
      message: '_{{ approvedBy.fullName }}_ **approved** unsuspending _{{ user.fullName }}_'
      actor-id: '{{ approvedBy.id }}'
      verb: approved
      object: user
      object-id: '{{ user.id }}'
