# Mailing List Workflows
---

- id: mailing-list-member-confirmation-requested
  vars:
    member: '{{ event.member }}'
    mailingList: '{{ event.mailingList }}'
    confirmUrl: '{{ event.confirmUrl }}'
  workflow:
    - email:
      to-email: '{{ member.emailAddress }}'
      subject: '{{ site.name }} - Please confirm your subscription'
      template: 'mailinglists/confirm-subscription'

# Fires from MailingListConfirmSubscriptionWidget once the recipient clicks the confirm link --
# NOT when they first submit the form. That is deliberate: under double opt-in the pending row
# is not a subscriber yet, so notifying at submit time would report people who never consented.
#
# Addressed by capability rather than role, matching user-registered in site-workflows.yml: a
# System Administrator holds community:manage but sits in the admin role, so a mail sent to
# 'community-manager' would reach them only through the empty-role fallback.
- id: mailing-list-member-created
  vars:
    member: '{{ event.member }}'
    mailingList: '{{ event.mailingList }}'
  workflow:
    # The subscriber's own welcome. Until this existed the confirmation flow told the ADMINS a
    # subscription had completed and told the subscriber nothing at all -- the last thing they saw
    # was an email asking them to confirm. This is also the first place an unsubscribe link belongs:
    # the confirmation email deliberately has none, because before confirming there is nothing to
    # unsubscribe from.
    - email:
      to-email: '{{ member.emailAddress }}'
      subject: 'Welcome to {{ mailingList.title }}'
      template: 'mailinglists/welcome-subscriber'
    - email:
      to-capability: 'community:manage'
      subject: 'New {{ mailingList.title }} subscriber'
      template: 'mailinglists/admin-member-created-notification'
